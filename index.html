<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8734f4">
  <meta name="description" content="Интерактивная мобильная карта офиса Uzum E-com по этажам">
  <title>Карта офиса Uzum E-com</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; }
    body { font-family: Arial, sans-serif; }
    .reader { position: relative; width: 100%; height: 100%; height: 100dvh; overflow: hidden; touch-action: pan-y; }
    .track { display: flex; height: 100%; width: 100%; transform: translate3d(0,0,0); transition: transform 320ms cubic-bezier(.2,.7,.2,1); will-change: transform; }
    .slide { width: 100%; flex: 0 0 100%; height: 100%; overflow-y: auto; overflow-x: hidden; overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .slide::-webkit-scrollbar { display: none; }
    .slide img { width: 100%; height: auto; display: block; user-select: none; -webkit-user-select: none; -webkit-user-drag: none; pointer-events: none; }
    @media (min-width: 650px) { .reader { max-width: 480px; margin: 0 auto; box-shadow: 0 0 30px #00000018; } body {background:#f5f4f8;} }
    @media (prefers-reduced-motion: reduce) { .track { transition: none; } }
  </style>
</head>
<body>
  <main class="reader" id="reader" aria-label="Карта офиса. Листайте влево и вправо для перехода между этажами">
    <div class="track" id="track">
      <section class="slide" aria-label="1 этаж"><img src="images/floor-1.png" alt="Карта первого этажа офиса" draggable="false"></section>
      <section class="slide" aria-label="2 этаж"><img src="images/floor-2.png" alt="Карта второго этажа офиса" loading="lazy" draggable="false"></section>
      <section class="slide" aria-label="3 этаж"><img src="images/floor-3.png" alt="Карта третьего этажа офиса" loading="lazy" draggable="false"></section>
      <section class="slide" aria-label="4 этаж"><img src="images/floor-4.png" alt="Карта четвертого этажа офиса" loading="lazy" draggable="false"></section>
      <section class="slide" aria-label="5 этаж"><img src="images/floor-5.png" alt="Карта пятого этажа офиса" loading="lazy" draggable="false"></section>
      <section class="slide" aria-label="6 этаж"><img src="images/floor-6.png" alt="Карта шестого этажа офиса" loading="lazy" draggable="false"></section>
      <section class="slide" aria-label="7 этаж"><img src="images/floor-7.png" alt="Карта седьмого этажа офиса" loading="lazy" draggable="false"></section>
    </div>
  </main>
  <script>
    (() => {
      const track = document.getElementById('track');
      const reader = document.getElementById('reader');
      const slides = [...track.children];
      let floor = 0;
      let startX = 0, startY = 0, startAt = 0;
      let activeTouch = false;
      let mouseDown = false;
      function showFloor(next) {
        next = Math.min(slides.length - 1, Math.max(0, next));
        if (next === floor) return;
        floor = next;
        track.style.transform = `translate3d(${-floor * 100}%, 0, 0)`;
        slides.forEach((slide, i) => { slide.setAttribute('aria-hidden', String(i !== floor)); });
        try { history.replaceState(null, '', `#floor-${floor + 1}`); } catch (_) {}
      }
      function trySwipe(dx, dy, elapsed) {
        if (Math.abs(dx) < 45 || Math.abs(dx) < Math.abs(dy) * 1.3 || elapsed > 1500) return;
        showFloor(floor + (dx < 0 ? 1 : -1));
      }
      reader.addEventListener('touchstart', (event) => {
        if (event.touches.length !== 1) { activeTouch = false; return; }
        const t = event.touches[0];
        startX = t.clientX; startY = t.clientY; startAt = Date.now(); activeTouch = true;
      }, {passive:true});
      reader.addEventListener('touchend', (event) => {
        if (!activeTouch || event.changedTouches.length !== 1) return;
        const t = event.changedTouches[0];
        trySwipe(t.clientX - startX, t.clientY - startY, Date.now() - startAt);
        activeTouch = false;
      }, {passive:true});
      reader.addEventListener('touchcancel', () => { activeTouch = false; }, {passive:true});
      reader.addEventListener('mousedown', e => {if (e.button !== 0) return; mouseDown = true; startX = e.clientX; startY = e.clientY; startAt = Date.now();});
      window.addEventListener('mouseup', e => {if (!mouseDown) return; mouseDown = false; trySwipe(e.clientX - startX, e.clientY - startY, Date.now() - startAt);});
      // No visible pagination/buttons: transitions are triggered only by horizontal swipes/drags.
      const initial = /^#floor-([1-7])$/.exec(location.hash);
      if (initial) { floor = Number(initial[1])-1; track.style.transition = 'none'; track.style.transform = `translate3d(${-floor * 100}%,0,0)`; requestAnimationFrame(() => {track.style.transition = '';}); }
      slides.forEach((slide, i) => slide.setAttribute('aria-hidden', String(i !== floor)));
    })();
  </script>
</body>
</html>
